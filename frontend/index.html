<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Provisio — Turn your codebase into an investor pitch deck</title>
    <meta
      name="description"
      content="Provisio reads your actual GitHub repository, works out what is genuinely hard about what you've built, and writes an investor pitch deck where every claim traces back to real evidence."
    />
    <link rel="canonical" href="https://repo-core-mvp.vercel.app/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Open Graph: how the link looks when shared in Slack, WhatsApp,
         LinkedIn or X. Without these a shared link shows a blank card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Provisio" />
    <meta property="og:title" content="Provisio — Turn your codebase into an investor pitch deck" />
    <meta
      property="og:description"
      content="Most deck tools rewrite what you type. Provisio reads your code, finds the hard engineering, and builds the deck around it."
    />
    <meta property="og:url" content="https://repo-core-mvp.vercel.app/" />
    <meta property="og:image" content="https://repo-core-mvp.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Provisio — Turn your codebase into an investor pitch deck" />
    <meta
      name="twitter:description"
      content="Connect your repo. Provisio reads the code, finds what's hard to copy, and writes the deck around real evidence."
    />
    <meta name="twitter:image" content="https://repo-core-mvp.vercel.app/og-image.png" />

    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Domani" />

    <!-- Structured data, so search engines describe the product and its
         pricing accurately instead of guessing from page text. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Provisio",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Provisio reads a startup's GitHub repository and company information, then writes and designs an investor pitch deck where every claim is backed by real evidence.",
        "url": "https://repo-core-mvp.vercel.app/",
        "publisher": { "@type": "Organization", "name": "Domani" },
        "offers": [
          { "@type": "Offer", "name": "Single deck", "price": "10.00", "priceCurrency": "USD" },
          { "@type": "Offer", "name": "Monthly", "price": "30.00", "priceCurrency": "USD" },
          { "@type": "Offer", "name": "Yearly", "price": "99.99", "priceCurrency": "USD" }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
